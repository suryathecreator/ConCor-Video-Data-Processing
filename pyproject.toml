[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concor-video"
version = "0.1.0"
description = "Tracklet-text correspondence generation with SAM 3.1 for Ref-YouTube-VOS and ReVOS"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "suryathecreator"}]
dependencies = [
  "numpy>=1.26,<2",
  "Pillow>=10",
  "pyarrow>=16",
  "spacy>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
concor-video = "concor_video.cli:main"

[project.urls]
Repository = "https://github.com/suryathecreator/ConCor-Video-Data-Processing"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
